<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Thi Trắc Nghiệm</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #22c55e;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-muted);
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-outline:hover {
            background: #eef2ff;
            color: var(--primary-hover);
        }

        .exam-item {
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.2s;
        }

        .exam-item:hover {
            border-color: var(--primary);
        }

        .exam-info h3 {
            font-size: 1.2rem;
            margin-bottom: 4px;
        }

        .exam-info p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.95rem;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--primary);
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        #timer {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--danger);
            background: #fef2f2;
            padding: 6px 14px;
            border-radius: 20px;
        }

        .question-card {
            margin-bottom: 28px;
        }

        .question-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 14px;
        }

        .options {
            display: grid;
            gap: 10px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: #f8fafc;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .option-label:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }

        .option-label input {
            margin-right: 12px;
            accent-color: var(--primary);
            width: 18px;
            height: 18px;
        }

        .result-box {
            text-align: center;
            padding: 20px 0;
        }

        .score-display {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary);
            margin: 16px 0;
        }

        .result-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 24px;
        }

        .review-item {
            text-align: left;
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 12px;
            background: #f8fafc;
            border: 1px solid var(--border);
        }

        .review-correct { border-left: 4px solid var(--success); }
        .review-wrong { border-left: 4px solid var(--danger); }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 6px;
        }

        .badge-success { background: #dcfce7; color: #166534; }
        .badge-danger { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Hệ Thống Thi Trắc Nghiệm</h1>
            <p>Ôn tập kiến thức trực tuyến dễ dàng & hiệu quả</p>
        </header>

        <!-- CHỌN ĐỀ THI -->
        <div id="exam-selection" class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2>Danh Sách Đề Thi</h2>
                <button class="btn btn-outline" onclick="toggleCreateExam()">+ Thêm Đề Mới</button>
            </div>

            <!-- Khung tạo đề -->
            <div id="create-exam-box" style="display: none; background: #f8fafc; padding: 20px; border-radius: 12px; margin-bottom: 24px; border: 1px dashed var(--primary);">
                <h3 style="margin-bottom: 16px; color: var(--primary);">Tạo Bộ Đề Thi Mới</h3>
                <div class="form-group">
                    <label>Tên đề thi:</label>
                    <input type="text" id="new-exam-title" placeholder="VD: Đề Thi Thử Môn Hóa 15 Phút">
                </div>
                <div class="form-group">
                    <label>Thời gian làm bài (Phút):</label>
                    <input type="number" id="new-exam-time" value="15">
                </div>
                
                <h4 style="margin: 16px 0 8px 0;">Nhập Câu Hỏi:</h4>
                <div id="new-questions-container"></div>

                <button class="btn btn-outline" onclick="addQuestionField()" style="width: 100%; margin-bottom: 16px;">+ Thêm Câu Hỏi Khác</button>
                <div style="display: flex; gap: 10px;">
                    <button class="btn" onclick="saveNewExam()">Lưu Đề Thi</button>
                    <button class="btn btn-outline" onclick="toggleCreateExam()">Hủy</button>
                </div>
            </div>

            <div id="exam-list"></div>
        </div>

        <!-- LÀM BÀI -->
        <div id="quiz-container" class="card" style="display: none;">
            <div class="quiz-header">
                <h2 id="exam-title">Tên Đề Thi</h2>
                <div id="timer">⏱️ <span id="time-left">00:00</span></div>
            </div>
            <div id="question-box"></div>
            <button class="btn" onclick="submitQuiz()" style="width: 100%; margin-top: 20px;">Nộp Bài</button>
        </div>

        <!-- KẾT QUẢ -->
        <div id="result-container" class="card" style="display: none;">
            <div class="result-box">
                <h2>Kết Quả Làm Bài</h2>
                <div class="score-display" id="score-text">0/0</div>
                <div id="review-box" style="margin-top: 24px;"></div>
                <div class="result-actions">
                    <button class="btn" onclick="location.reload()">Quay Về Trang Chủ</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        var exams = [
            {
                id: 1,
                title: "Đề Thi Khởi Động Môn Hóa (Mẫu)",
                time: 15,
                questions: [
                    {
                        question: "Công thức hóa học của nước là gì?",
                        options: ["CO2", "H2O", "NaCl", "HCl"],
                        correct: 1
                    },
                    {
                        question: "Phát biểu nào sau đây đúng về Axit?",
                        options: ["Làm quỳ tím hóa đỏ", "Làm quỳ tím hóa xanh", "Không đổi màu quỳ tím", "Có vị chát"],
                        correct: 0
                    }
                ]
            }
        ];

        try {
            var saved = localStorage.getItem('my_exams_v3');
            if (saved) {
                exams = JSON.parse(saved);
            }
        } catch (e) {}

        var currentExam = null;
        var userAnswers = {};
        var timerInterval;

        function renderExamList() {
            var listEl = document.getElementById('exam-list');
            if (!listEl) return;
            var html = '';
            for (var i = 0; i < exams.length; i++) {
                var exam = exams[i];
                html += '<div class="exam-item">' +
                    '<div class="exam-info">' +
                        '<h3>' + exam.title + '</h3>' +
                        '<p>⏱️ Thời gian: ' + exam.time + ' phút | ❓ Số câu: ' + exam.questions.length + ' câu</p>' +
                    '</div>' +
                    '<button class="btn" onclick="startQuiz(' + i + ')">Vào Làm Bài</button>' +
                '</div>';
            }
            listEl.innerHTML = html;
        }

        function startQuiz(examIndex) {
            currentExam = exams[examIndex];
            userAnswers = {};

            document.getElementById('exam-selection').style.display = 'none';
            document.getElementById('quiz-container').style.display = 'block';
            document.getElementById('exam-title').textContent = currentExam.title;

            renderQuestions();
            startTimer(currentExam.time * 60);
        }

        function renderQuestions() {
            var html = '';
            for (var i = 0; i < currentExam.questions.length; i++) {
                var q = currentExam.questions[i];
                html += '<div class="question-card">' +
                    '<div class="question-title">Câu ' + (i + 1) + ': ' + q.question + '</div>' +
                    '<div class="options">';
                for (var j = 0; j < q.options.length; j++) {
                    html += '<label class="option-label">' +
                        '<input type="radio" name="q_' + i + '" value="' + j + '" onclick="userAnswers[' + i + '] = ' + j + '">' +
                        q.options[j] +
                    '</label>';
                }
                html += '</div></div>';
            }
            document.getElementById('question-box').innerHTML = html;
        }

        function startTimer(seconds) {
            var timer = seconds;
            timerInterval = setInterval(function() {
                var m = Math.floor(timer / 60);
                var s = timer % 60;
                document.getElementById('time-left').textContent = 
                    (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);

                if (--timer < 0) {
                    clearInterval(timerInterval);
                    alert('Hết giờ làm bài!');
                    submitQuiz();
                }
            }, 1000);
        }

        function submitQuiz() {
            clearInterval(timerInterval);
            var score = 0;
            var reviewHtml = '<h3 style="text-align:left; margin-bottom: 12px;">Chi tiết bài làm:</h3>';

            for (var i = 0; i < currentExam.questions.length; i++) {
                var q = currentExam.questions[i];
                var userAns = userAnswers[i];
                var isCorrect = userAns === q.correct;
                if (isCorrect) score++;

                reviewHtml += '<div class="review-item ' + (isCorrect ? 'review-correct' : 'review-wrong') + '">' +
                    '<div style="font-weight:600;">Câu ' + (i + 1) + ': ' + q.question + '</div>' +
                    '<div style="font-size: 0.9rem; margin-top: 4px;">Bạn chọn: <b>' + (userAns !== undefined ? q.options[userAns] : 'Chưa chọn') + '</b></div>' +
                    '<div style="font-size: 0.9rem;">Đáp án đúng: <b>' + q.options[q.correct] + '</b></div>' +
                    '<span class="badge ' + (isCorrect ? 'badge-success' : 'badge-danger') + '">' + (isCorrect ? 'Đúng' : 'Sai') + '</span>' +
                '</div>';
            }

            document.getElementById('quiz-container').style.display = 'none';
            document.getElementById('result-container').style.display = 'block';
            document.getElementById('score-text').textContent = score + ' / ' + currentExam.questions.length;
            document.getElementById('review-box').innerHTML = reviewHtml;
        }

        function toggleCreateExam() {
            var box = document.getElementById('create-exam-box');
            box.style.display = box.style.display === 'none' ? 'block' : 'none';
            if (box.style.display === 'block' && document.getElementById('new-questions-container').children.length === 0) {
                addQuestionField();
            }
        }

        var questionCount = 0;
        function addQuestionField() {
            questionCount++;
            var container = document.getElementById('new-questions-container');
            var qDiv = document.createElement('div');
            qDiv.className = 'new-q-item';
            qDiv.style.marginBottom = '16px';
            qDiv.style.padding = '12px';
            qDiv.style.background = '#fff';
            qDiv.style.borderRadius = '8px';
            qDiv.style.border = '1px solid var(--border)';

            qDiv.innerHTML = 
                '<div class="form-group">' +
                    '<label>Câu hỏi ' + questionCount + ':</label>' +
                    '<input type="text" class="q-text" placeholder="Nhập nội dung câu hỏi">' +
                '</div>' +
                '<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">' +
                    '<input type="text" class="q-opt-0" placeholder="Đáp án A">' +
                    '<input type="text" class="q-opt-1" placeholder="Đáp án B">' +
                    '<input type="text" class="q-opt-2" placeholder="Đáp án C">' +
                    '<input type="text" class="q-opt-3" placeholder="Đáp án D">' +
                '</div>' +
                '<div class="form-group" style="margin-top: 8px;">' +
                    '<label>Đáp án đúng:</label>' +
                    '<select class="q-correct">' +
                        '<option value="0">Đáp án A</option>' +
                        '<option value="1">Đáp án B</option>' +
                        '<option value="2">Đáp án C</option>' +
                        '<option value="3">Đáp án D</option>' +
                    '</select>' +
                '</div>';
            container.appendChild(qDiv);
        }

        function saveNewExam() {
            var title = document.getElementById('new-exam-title').value.trim();
            var time = parseInt(document.getElementById('new-exam-time').value);

            if (!title) {
                alert('Vui lòng nhập tên đề thi!');
                return;
            }

            var qElements = document.querySelectorAll('.new-q-item');
            var questions = [];

            for (var i = 0; i < qElements.length; i++) {
                var el = qElements[i];
                var qText = el.querySelector('.q-text').value.trim();
                var opt0 = el.querySelector('.q-opt-0').value.trim();
                var opt1 = el.querySelector('.q-opt-1').value.trim();
                var opt2 = el.querySelector('.q-opt-2').value.trim();
                var opt3 = el.querySelector('.q-opt-3').value.trim();
                var correct = parseInt(el.querySelector('.q-correct').value);

                if (qText && opt0 && opt1) {
                    questions.push({
                        question: qText,
                        options: [opt0, opt1, opt2 || "C", opt3 || "D"],
                        correct: correct
                    });
                }
            }

            if (questions.length === 0) {
                alert('Vui lòng nhập ít nhất 1 câu hỏi!');
                return;
            }

            var newExam = {
                id: Date.now(),
                title: title,
                time: time || 15,
                questions: questions
            };

            exams.push(newExam);
            try {
                localStorage.setItem('my_exams_v3', JSON.stringify(exams));
            } catch (e) {}
            
            alert('Thêm đề thi thành công!');
            document.getElementById('new-exam-title').value = '';
            document.getElementById('new-questions-container').innerHTML = '';
            questionCount = 0;
            toggleCreateExam();
            renderExamList();
        }

        window.onload = function() {
            renderExamList();
        };
    </script>
</body>
</html>
