<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Trắc Nghiệm Trực Tuyến</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #22c55e;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        header h1 {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-muted);
        }

        .user-badge {
            position: absolute;
            right: 0;
            top: 0;
            font-size: 0.9rem;
            background: #eef2ff;
            color: var(--primary);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-outline:hover {
            background: #eef2ff;
            color: var(--primary-hover);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.95rem;
        }

        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--primary);
        }

        .exam-item {
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.2s;
        }

        .exam-item:hover {
            border-color: var(--primary);
        }

        .auth-switch {
            text-align: center;
            margin-top: 18px;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .auth-switch span {
            color: var(--primary);
            cursor: pointer;
            font-weight: 600;
        }

        .error-msg {
            background: #fef2f2;
            color: var(--danger);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            margin-bottom: 16px;
            text-align: center;
            border: 1px solid #fecaca;
            display: none;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        #timer {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--danger);
            background: #fef2f2;
            padding: 6px 14px;
            border-radius: 20px;
        }

        .question-card {
            margin-bottom: 28px;
        }

        .question-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 14px;
        }

        .options {
            display: grid;
            gap: 10px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: #f8fafc;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .option-label:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }

        .option-label input {
            margin-right: 12px;
            accent-color: var(--primary);
            width: 18px;
            height: 18px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Hệ Thống Trắc Nghiệm Trực Tuyến</h1>
            <p>Nền tảng kiểm tra kiến thức thông minh</p>
            <div id="user-info-bar" style="display: none;">
                <span class="user-badge" id="current-user-badge"></span>
                <button class="btn btn-outline" style="padding: 6px 12px; font-size: 0.85rem; margin-top: 6px;" onclick="logoutSystem()">Đăng Xuất</button>
            </div>
        </header>

        <!-- 1. MÀN HÌNH ĐĂNG NHẬP / ĐĂNG KÝ HỌC SINH & GIÁO VIÊN -->
        <div id="auth-container" class="card" style="max-width: 400px; margin: 0 auto;">
            <h2 id="auth-title" style="text-align: center; margin-bottom: 20px;">Đăng Nhập Hệ Thống</h2>
            
            <div id="error-alert" class="error-msg"></div>

            <div class="form-group">
                <label>Tên đăng nhập:</label>
                <input type="text" id="auth-username" placeholder="Nhập tên đăng nhập...">
            </div>
            
            <div class="form-group">
                <label>Mật khẩu:</label>
                <input type="password" id="auth-password" placeholder="Nhập mật khẩu...">
            </div>

            <button class="btn" id="auth-action-btn" onclick="processAuthentication()" style="width: 100%; margin-top: 10px;">Đăng Nhập</button>
            
            <div class="auth-switch">
                <span id="switch-mode-text" onclick="switchAuthMode()">Học sinh chưa có tài khoản? Đăng ký ngay</span>
            </div>
        </div>

        <!-- 2. MÀN HÌNH CHÍNH -->
        <div id="main-app" style="display: none;">
            
            <!-- BẢNG QUẢN TRỊ DÀNH RIÊNG CHO THẦY TRÍ -->
            <div id="teacher-dashboard" class="card" style="display: none; border-left: 6px solid var(--primary);">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h3 style="color: var(--primary);">🛠️ Chào Thầy Trí - Bảng Quản Trị Đề Thi</h3>
                    <button class="btn" onclick="toggleCreateExamBox()">+ Soạn Đề Thi Mới</button>
                </div>

                <div id="create-exam-panel" style="display: none; margin-top: 24px; background: #f8fafc; padding: 20px; border-radius: 12px; border: 1px dashed var(--primary);">
                    <h3 style="margin-bottom: 16px; color: var(--primary);">Tạo Bộ Đề Mới</h3>
                    
                    <div class="form-group">
                        <label>Tên đề thi:</label>
                        <input type="text" id="new-exam-title" placeholder="VD: Kiểm tra 15 phút Hóa Học">
                    </div>
                    
                    <div class="form-group">
                        <label>Thời gian làm bài (Phút):</label>
                        <input type="number" id="new-exam-time" value="15">
                    </div>
                    
                    <h4 style="margin: 16px 0 8px 0;">Danh Sách Câu Hỏi:</h4>
                    <div id="dynamic-questions-list"></div>

                    <button class="btn btn-outline" onclick="appendQuestionInput()" style="width: 100%; margin-bottom: 16px;">+ Thêm Câu Hỏi Khác</button>
                    
                    <div style="display: flex; gap: 12px;">
                        <button class="btn" onclick="commitNewExamData()">Lưu Đề Lên Hệ Thống</button>
                        <button class="btn btn-outline" onclick="toggleCreateExamBox()">Hủy Bỏ</button>
                    </div>
                </div>
            </div>

            <!-- DANH SÁCH ĐỀ THI CHO TẤT CẢ MỌI NGƯỜI LÀM -->
            <div class="card">
                <h2>Danh Sách Đề Thi Khả Dụng</h2>
                <div id="exam-list-container" style="margin-top: 20px;"></div>
            </div>
        </div>

        <!-- 3. MÀN HÌNH LÀM BÀI THI -->
        <div id="quiz-screen" class="card" style="display: none;">
            <div class="quiz-header">
                <h2 id="active-exam-title">Tên Đề Thi</h2>
                <div id="timer">⏱️ <span id="time-left-clock">00:00</span></div>
            </div>
            <div id="questions-render-box"></div>
            <button class="btn" onclick="submitExamPaper()" style="width: 100%; margin-top: 20px;">Nộp Bài Thi</button>
        </div>

        <!-- 4. MÀN HÌNH KẾT QUẢ -->
        <div id="result-screen" class="card" style="display: none; text-align: center;">
            <h2>Kết Quả Bài Làm</h2>
            <div style="font-size: 3rem; font-weight: 800; color: var(--primary); margin: 16px 0;" id="final-score-text">0/0</div>
            <div id="detailed-review-box" style="margin-top: 24px; text-align: left;"></div>
            <button class="btn" onclick="location.reload()" style="margin-top: 24px;">Quay Về Trang Chủ</button>
        </div>

    </div>

    <script>
        // Danh sách tài khoản học sinh đăng ký (lưu tự do)
        let studentUsers = JSON.parse(localStorage.getItem('student_users_v7')) || [];
        
        // Danh sách đề thi
        let systemExams = JSON.parse(localStorage.getItem('app_exams_v7')) || [
            {
                id: 1,
                title: "Đề Thi Khởi Động Hóa Học (Mẫu)",
                time: 15,
                questions: [
                    { question: "Công thức hóa học của nước là gì?", options: ["CO2", "H2O", "NaCl", "HCl"], correct: 1 },
                    { question: "Kim loại nào nhẹ nhất trong tất cả các kim loại?", options: ["Na", "Li", "K", "Al"], correct: 1 }
                ]
            }
        ];

        let activeUser = JSON.parse(localStorage.getItem('active_user_v7')) || null;
        let isRegisterMode = false;
        let currentSelectedExam = null;
        let studentChoices = {};
        let countdownTimer = null;

        function displayErrorAlert(msg) {
            let alertBox = document.getElementById('error-alert');
            alertBox.textContent = msg;
            alertBox.style.display = 'block';
        }

        function hideErrorAlert() {
            document.getElementById('error-alert').style.display = 'none';
        }

        // Chuyển đổi giữa chế độ Đăng nhập và Đăng ký học sinh
        function switchAuthMode() {
            isRegisterMode = !isRegisterMode;
            hideErrorAlert();
            document.getElementById('auth-title').textContent = isRegisterMode ? "Đăng Ký Tài Khoản Học Sinh" : "Đăng Nhập Hệ Thống";
            document.getElementById('auth-action-btn').textContent = isRegisterMode ? "Đăng Ký Ngay" : "Đăng Nhập";
            document.getElementById('switch-mode-text').textContent = isRegisterMode ? "Đã có tài khoản? Đăng nhập tại đây" : "Học sinh chưa có tài khoản? Đăng ký ngay";
        }

        function processAuthentication() {
            hideErrorAlert();
            let uField = document.getElementById('auth-username').value.trim();
            let pField = document.getElementById('auth-password').value.trim();

            if (!uField || !pField) {
                displayErrorAlert("⚠️ Vui lòng nhập đầy đủ tên đăng nhập và mật khẩu!");
                return;
            }

            if (isRegisterMode) {
                // Kiểm tra trùng tên với Thầy Trí hoặc học sinh khác
                if (uField === "Trí") {
                    displayErrorAlert("⚠️ Tên đăng nhập này là của giáo viên, vui lòng chọn tên khác!");
                    return;
                }
                if (studentUsers.some(s => s.username === uField)) {
                    displayErrorAlert("⚠️ Tên đăng nhập này đã tồn tại, vui lòng chọn tên khác!");
                    return;
                }

                studentUsers.push({ username: uField, pass: pField });
                localStorage.setItem('student_users_v7', JSON.stringify(studentUsers));
                alert("Đăng ký tài khoản học sinh thành công! Hãy đăng nhập.");
                switchAuthMode();
            } else {
                // Kiểm tra xem có phải Thầy Trí không
                if (uField === "Trí") {
                    if (pField !== "08082009") {
                        displayErrorAlert("❌ Mật khẩu Giáo viên không chính xác!");
                        return;
                    }
                    activeUser = { username: "Trí", role: "teacher" };
                } else {
                    // Kiểm tra tài khoản học sinh
                    let foundStudent = studentUsers.find(s => s.username === uField);
                    if (!foundStudent) {
                        displayErrorAlert("❌ Tên đăng nhập không tồn tại trong hệ thống!");
                        return;
                    }
                    if (foundStudent.pass !== pField) {
                        displayErrorAlert("❌ Mật khẩu học sinh không chính xác!");
                        return;
                    }
                    activeUser = { username: foundStudent.username, role: "student" };
                }

                localStorage.setItem('active_user_v7', JSON.stringify(activeUser));
                initializeDashboard();
            }
        }

        function logoutSystem() {
            localStorage.removeItem('active_user_v7');
            location.reload();
        }

        function initializeDashboard() {
            if (activeUser) {
                document.getElementById('auth-container').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
                document.getElementById('user-info-bar').style.display = 'block';
                document.getElementById('current-user-badge').textContent = `${activeUser.username} (${activeUser.role === 'teacher' ? 'Giáo Viên' : 'Học Sinh'})`;

                if (activeUser.role === 'teacher') {
                    document.getElementById('teacher-dashboard').style.display = 'block';
                } else {
                    document.getElementById('teacher-dashboard').style.display = 'none';
                }
                renderExamListUI();
            }
        }

        function renderExamListUI() {
            let container = document.getElementById('exam-list-container');
            container.innerHTML = '';
            
            if (systemExams.length === 0) {
                container.innerHTML = '<p style="color:var(--text-muted);">Chưa có đề thi nào được tạo.</p>';
                return;
            }

            systemExams.forEach((exam, index) => {
                container.innerHTML += `
                    <div class="exam-item">
                        <div>
                            <h3>${exam.title}</h3>
                            <p style="font-size:0.9rem; color:var(--text-muted); margin-top:4px;">⏱️ Thời gian: ${exam.time} phút | ❓ Số câu: ${exam.questions.length} câu</p>
                        </div>
                        <button class="btn" onclick="startDoingExam(${index})">Vào Làm Bài</button>
                    </div>
                `;
            });
        }

        function toggleCreateExamBox() {
            let panel = document.getElementById('create-exam-panel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
            if (panel.style.display === 'block' && document.getElementById('dynamic-questions-list').children.length === 0) {
                appendQuestionInput();
            }
        }

        let questionIndexCounter = 0;
        function appendQuestionInput() {
            questionIndexCounter++;
            let listContainer = document.getElementById('dynamic-questions-list');
            let itemDiv = document.createElement('div');
            itemDiv.className = 'custom-q-item';
            itemDiv.style.cssText = "background:#fff; padding:14px; border-radius:8px; margin-bottom:12px; border:1px solid var(--border);";
            
            itemDiv.innerHTML = `
                <div class="form-group">
                    <label>Câu hỏi ${questionIndexCounter}:</label>
                    <input type="text" class="input-q-text" placeholder="Nhập nội dung câu hỏi...">
                </div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
                    <input type="text" class="input-opt-0" placeholder="Đáp án A">
                    <input type="text" class="input-opt-1" placeholder="Đáp án B">
                    <input type="text" class="input-opt-2" placeholder="Đáp án C">
                    <input type="text" class="input-opt-3" placeholder="Đáp án D">
                </div>
                <div class="form-group" style="margin-top:10px;">
                    <label>Đáp án đúng:</label>
                    <select class="input-correct-ans" style="width:100%; padding:8px; border:1px solid var(--border); border-radius:6px;">
                        <option value="0">Đáp án A</option>
                        <option value="1">Đáp án B</option>
                        <option value="2">Đáp án C</option>
                        <option value="3">Đáp án D</option>
                    </select>
                </div>
            `;
            listContainer.appendChild(itemDiv);
        }

        function commitNewExamData() {
            let titleVal = document.getElementById('new-exam-title').value.trim();
            let timeVal = parseInt(document.getElementById('new-exam-time').value) || 15;

            if (!titleVal) {
                alert("Vui lòng nhập tên đề thi!");
                return;
            }

            let questionBlocks = document.querySelectorAll('.custom-q-item');
            let extractedQuestions = [];

            questionBlocks.forEach(block => {
                let qText = block.querySelector('.input-q-text').value.trim();
                let o0 = block.querySelector('.input-opt-0').value.trim();
                let o1 = block.querySelector('.input-opt-1').value.trim();
                let o2 = block.querySelector('.input-opt-2').value.trim();
                let o3 = block.querySelector('.input-opt-3').value.trim();
                let correctIdx = parseInt(block.querySelector('.input-correct-ans').value);

                if (qText && o0 && o1) {
                    extractedQuestions.push({
                        question: qText,
                        options: [o0, o1, o2 || "C", o3 || "D"],
                        correct: correctIdx
                    });
                }
            });

            if (extractedQuestions.length === 0) {
                alert("Vui lòng nhập ít nhất 1 câu hỏi hoàn chỉnh!");
                return;
            }

            systemExams.push({
                id: Date.now(),
                title: titleVal,
                time: timeVal,
                questions: extractedQuestions
            });

            localStorage.setItem('app_exams_v7', JSON.stringify(systemExams));
