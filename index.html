<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Luyện Thi Trắc Nghiệm</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #22c55e;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 850px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--primary);
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .user-badge {
            position: absolute;
            right: 0;
            top: 0;
            background: #eef2ff;
            color: var(--primary);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            width: auto;
        }

        .btn-outline:hover {
            background: #eef2ff;
        }

        .btn-link {
            background: none;
            border: none;
            color: var(--primary);
            font-weight: 600;
            cursor: pointer;
            text-decoration: underline;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: none;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--primary);
        }

        .alert-box {
            background: #fef2f2;
            color: var(--danger);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.95rem;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid #fecaca;
            display: none;
        }

        .exam-item {
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fafaf9;
            transition: border-color 0.2s;
        }

        .exam-item:hover {
            border-color: var(--primary);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Hệ Thống Luyện Thi Trắc Nghiệm</h1>
            <p>Ôn tập kiến thức thông minh & trắc nghiệm ngẫu nhiên</p>
            <div id="user-top-bar" style="display: none;">
                <span class="user-badge" id="user-role-label"></span>
                <button type="button" class="btn btn-outline" style="padding: 6px 14px; font-size: 0.85rem; margin-top: 6px;" onclick="systemLogout()">Đăng Xuất</button>
            </div>
        </header>

        <!-- KHUNG ĐĂNG NHẬP -->
        <div id="login-section" class="card" style="max-width: 420px; margin: 0 auto;">
            <h2 style="text-align: center; margin-bottom: 24px;">Đăng Nhập Hệ Thống</h2>
            <div id="login-alert" class="alert-box"></div>
            <div class="form-group">
                <label>Tên đăng nhập:</label>
                <input type="text" id="login-username" placeholder="Nhập tài khoản...">
            </div>
            <div class="form-group">
                <label>Mật khẩu:</label>
                <input type="password" id="login-password" placeholder="Nhập mật khẩu...">
            </div>
            <button type="button" class="btn" onclick="executeLogin()">Đăng Nhập</button>
            <div style="text-align: center; margin-top: 20px; font-size: 0.95rem; color: var(--text-muted);">
                Học sinh chưa có tài khoản? <button type="button" class="btn-link" onclick="switchView('register')">Đăng ký ngay</button>
            </div>
        </div>

        <!-- KHUNG ĐĂNG KÝ HỌC SINH -->
        <div id="register-section" class="card" style="max-width: 420px; margin: 0 auto; display: none;">
            <h2 style="text-align: center; margin-bottom: 24px;">Đăng Ký Học Sinh</h2>
            <div id="register-alert" class="alert-box"></div>
            <div class="form-group">
                <label>Tên đăng nhập mới:</label>
                <input type="text" id="reg-username" placeholder="Chọn tên đăng nhập...">
            </div>
            <div class="form-group">
                <label>Mật khẩu:</label>
                <input type="password" id="reg-password" placeholder="Tạo mật khẩu...">
            </div>
            <button type="button" class="btn" onclick="executeRegister()">Đăng Ký Tài Khoản</button>
            <div style="text-align: center; margin-top: 20px; font-size: 0.95rem; color: var(--text-muted);">
                Đã có tài khoản? <button type="button" class="btn-link" onclick="switchView('login')">Đăng nhập ngay</button>
            </div>
        </div>

        <!-- MÀN HÌNH CHÍNH -->
        <div id="dashboard-section" style="display: none;">
            <!-- KHUNG SOẠN ĐỀ CHO GIÁO VIÊN TRÍ -->
            <div id="teacher-panel" class="card" style="display: none; border-left: 6px solid var(--primary);">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h3 style="color: var(--primary);">🛠️ Chào Thầy Trí - Kho Đề & Trộn Ngẫu Nhiên</h3>
                    <button type="button" class="btn btn-outline" onclick="toggleExamBuilder()" style="width: auto;">+ Soạn Kho Đề Mới</button>
                </div>

                <div id="builder-form" style="display: none; margin-top: 24px; background: #f1f5f9; padding: 20px; border-radius: 12px;">
                    <h3 style="margin-bottom: 16px; color: var(--primary);">Tạo Kho Câu Hỏi Trắc Nghiệm</h3>
                    
                    <div class="form-group">
                        <label>Tên bộ đề / Chủ đề:</label>
                        <input type="text" id="exam-title-input" placeholder="VD: Kho Đề Ôn Tập Hóa 12">
                    </div>
                    
                    <div class="form-group">
                        <label>Thời gian làm bài (Phút):</label>
                        <input type="number" id="exam-time-input" value="15">
                    </div>

                        <label>Số lượng câu hỏi ngẫu nhiên lấy ra cho học sinh làm (VD: Kho có 20 câu, lấy ra 10 câu):</label>
