<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Trắc Nghiệm Trực Tuyến</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #22c55e;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 30px 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 800px; }
        
        header { text-align: center; margin-bottom: 25px; position: relative; }
        header h1 { font-size: 1.8rem; color: var(--primary); margin-bottom: 6px; }
        .user-badge { position: absolute; right: 0; top: 0; font-size: 0.9rem; background: #eef2ff; color: var(--primary); padding: 6px 12px; border-radius: 20px; font-weight: 600; }

        .card { background: var(--card-bg); border-radius: 16px; padding: 28px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); border: 1px solid var(--border); margin-bottom: 20px; }
        
        .btn { background: var(--primary); color: white; border: none; padding: 10px 20px; font-size: 0.95rem; font-weight: 600; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: var(--primary-hover); }
        .btn-outline { background: transparent; color: var(--primary); border: 2px solid var(--primary); }
        .btn-outline:hover { background: #eef2ff; }
        .btn-danger { background: var(--danger); }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; }
        .form-group input, .form-group select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; outline: none; }

        .exam-item { border: 1px solid var(--border); padding: 16px; border-radius: 10px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .auth-switch { text-align: center; margin-top: 15px; font-size: 0.9rem; color: var(--text-muted); }
        .auth-switch span { color: var(--primary); cursor: pointer; font-weight: 600; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1 id="main-title">Hệ Thống Trắc Nghiệm</h1>
            <p>Nền tảng kiểm tra kiến thức trực tuyến</p>
            <div id="user-info-bar" style="display: none;">
                <span class="user-badge" id="current-user-badge"></span>
                <button class="btn btn-outline" style="padding: 4px 10px; font-size: 0.8rem; margin-top: 5px;" onclick="logout()">Đăng Xuất</button>
            </div>
        </header>

        <!-- 1. MÀN HÌNH ĐĂNG NHẬP / ĐĂNG KÝ -->
        <div id="auth-container" class="card" style="max-width: 400px; margin: 0 auto;">
            <h2 id="auth-title" style="text-align: center; margin-bottom: 20px;">Đăng Nhập Tài Khoản</h2>
            
            <div class="form-group">
                <label>Tên đăng nhập:</label>
                <input type="text" id="auth-username" placeholder="Nhập username...">
            </div>
            <div class="form-group">
                <label>Mật khẩu:</label>
                <input type="password" id="auth-password" placeholder="Nhập mật khẩu...">
            </div>
            
            <!-- Chỉ hiện khi đăng ký -->
            <div class="form-group" id="role-group" style="display: none;">
                <label>Vai trò của bạn:</label>
                <select id="auth-role">
                    <option value="student">Học Sinh (Làm bài)</option>
                    <option value="teacher">Giáo Viên (Tạo đề & Quản lý)</option>
                </select>
            </div>

            <button class="btn" id="auth-btn" onclick="handleAuth()" style="width: 100%; margin-top: 10px;">Đăng Nhập</button>
            
            <div class="auth-switch">
                <span id="switch-text" onclick="toggleAuthMode()">Chưa có tài khoản? Đăng ký ngay</span>
            </div>
        </div>

        <!-- 2. MÀN HÌNH CHÍNH (GIAO DIỆN CHUNG & DANH SÁCH ĐỀ) -->
        <div id="main-app" style="display: none;">
            
            <!-- Khu vực dành riêng cho GIÁO VIÊN -->
            <div id="teacher-panel" class="card" style="display: none; border-left: 5px solid var(--primary);">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h3 style="color: var(--primary);">🛠️ Bảng Điều Khiển Giáo Viên</h3>
                    <button class="btn" onclick="toggleCreateExam()">+ Tạo Đề Thi Mới</button>
                </div>

                <!-- Form tạo đề -->
                <div id="create-exam-box" style="display: none; margin-top: 20px; background: #f1f5f9; padding: 16px; border-radius: 10px;">
                    <h4>Thêm Đề Thi Mới</h4>
                    <div class="form-group" style="margin-top: 10px;">
                        <label>Tên đề thi:</label>
                        <input type="text" id="new-exam-title" placeholder="VD: Kiểm tra 15 phút Hóa">
                    </div>
                    <div class="form-group">
                        <label>Thời gian (phút):</label>
                        <input type="number" id="new-exam-time" value="15">
                    </div>
                    
                    <div id="new-questions-container"></div>
                    <button class="btn btn-outline" onclick="addQuestionField()" style="width: 100%; margin: 10px 0;">+ Thêm Câu Hỏi</button>
                    <button class="btn" onclick="saveNewExam()">Lưu Đề Lên Hệ Thống</button>
                </div>
            </div>

            <!-- Danh sách đề thi (Cả HS và GV đều thấy để làm bài) -->
            <div class="card">
                <h2>Danh Sách Đề Thi Hiện Có</h2>
                <div id="exam-list" style="margin-top: 15px;"></div>
            </div>
        </div>

        <!-- 3. MÀN HÌNH LÀM BÀI -->
        <div id="quiz-container" class="card" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); padding-bottom: 12px; margin-bottom: 20px;">
                <h2 id="quiz-exam-title">Tên Đề</h2>
                <div id="timer" style="font-weight: 700; color: var(--danger);">⏱️ <span id="time-left">00:00</span></div>
            </div>
            <div id="question-box"></div>
            <button class="btn" onclick="submitQuiz()" style="width: 100%; margin-top: 15px;">Nộp Bài Thi</button>
        </div>

        <!-- 4. MÀN HÌNH KẾT QUẢ -->
        <div id="result-container" class="card" style="display: none; text-align: center;">
            <h2>Kết Quả Bài Làm</h2>
            <div style="font-size: 2.5rem; font-weight: 800; color: var(--primary); margin: 15px 0;" id="score-text">0/0</div>
            <div id="review-box" style="margin-top: 20px; text-align: left;"></div>
            <button class="btn" onclick="location.reload()" style="margin-top: 20px;">Quay Lại Trang Chủ</button>
        </div>

    </div>

    <script>
        // Khởi tạo tài khoản mẫu và đề thi mẫu nếu chưa có
        let users = JSON.parse(localStorage.getItem('app_users')) || [
            { username: "giaovien", pass: "123", role: "teacher" },
            { username: "hocsinh", pass: "123", role: "student" }
        ];

        let exams = JSON.parse(localStorage.getItem('app_exams')) || [
            {
                id: 1,
                title: "Đề Thi Trắc Nghiệm Hóa Học Mẫu",
                time: 15,
                questions: [
                    { question: "Hóa trị của Hi hidro (H) là mấy?", options: ["I", "II", "III", "IV"], correct: 0 },
                    { question: "Ký hiệu hóa học của Đồng là gì?", options: ["Fe", "Cu", "Ag", "Zn"], correct: 1 }
                ]
            }
        ];

        let currentUser = JSON.parse(localStorage.getItem('current_user')) || null;
        let isRegisterMode = false;
        let currentExam = null;
        let userAnswers = {};
        let timerInterval;

        // Xử lý chuyển đổi Đăng nhập / Đăng ký
        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('auth-title').textContent = isRegisterMode ? "Đăng Ký Tài Khoản Mới" : "Đăng Nhập Tài Khoản";
            document.getElementById('auth-btn').textContent = isRegisterMode ? "Đăng Ký" : "Đăng Nhập";
            document.getElementById('role-group').style.display = isRegisterMode ? "block" : "none";
            document.getElementById('switch-text').textContent = isRegisterMode ? "Đã có tài khoản? Đăng nhập" : "Chưa có tài khoản? Đăng ký ngay";
        }

        function handleAuth() {
            let u = document.getElementById('auth-username').value.trim();
            let p = document.getElementById('auth-password').value.trim();
            if(!u || !p) { alert("Vui lòng nhập đầy đủ thông tin!"); return; }

            if(isRegisterMode) {
                let role = document.getElementById('auth-role').value;
                if(users.some(x => x.username === u)) { alert("Tên đăng nhập đã tồn tại!"); return; }
                users.push({ username: u, pass: p, role: role });
                localStorage.setItem('app_users', JSON.stringify(users));
                alert("Đăng ký thành công! Hãy đăng nhập.");
                toggleAuthMode();
            } else {
                let found = users.find(x => x.username === u && x.pass === p);
                if(!found) { alert("Sai tên đăng nhập hoặc mật khẩu!"); return; }
                currentUser = found;
                localStorage.setItem('current_user', JSON.stringify(currentUser));
                checkLoginState();
            }
        }

        function logout() {
            localStorage.removeItem('current_user');
            location.reload();
        }

        function checkLoginState() {
            if(currentUser) {
                document.getElementById('auth-container').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
                document.getElementById('user-info-bar').style.display = 'block';
                document.getElementById('current-user-badge').textContent = `${currentUser.username} (${currentUser.role === 'teacher' ? 'Giáo Viên' : 'Học Sinh'})`;

                // Phân quyền hiển thị giao diện riêng
                if(currentUser.role === 'teacher') {
                    document.getElementById('teacher-panel').style.display = 'block';
                }
                renderExamList();
            }
        }

        // Render danh sách đề thi
        function renderExamList() {
            let list = document.getElementById('exam-list');
            list.innerHTML = '';
            if(exams.length === 0) { list.innerHTML = '<p style="color:var(--text-muted);">Chưa có đề thi nào.</p>'; return; }
            
            exams.forEach((ex, idx) => {
                list.innerHTML += `
                    <div class="exam-item">
                        <div>
                            <h4>${ex.title}</h4>
                            <p style="font-size:0.85rem; color:var(--text-muted);">⏱️ ${ex.time} phút \vert{} ❓ ${ex.questions.length} câu</p>
                        </div>
                        <button class="btn" onclick="startQuiz(${idx})">Vào Làm Bài</button>
                    </div>
                `;
            });
        }

        // Giáo viên: Thêm đề thi mới
        function toggleCreateExam() {
            let box = document.getElementById('create-exam-box');
            box.style.display = box.style.display === 'none' ? 'block' : 'none';
            if(box.style.display === 'block' && document.getElementById('new-questions-container').children.length === 0) {
                addQuestionField();
            }
        }

        let qCount = 0;
        function addQuestionField() {
            qCount++;
            let c = document.getElementById('new-questions-container');
            let div = document.createElement('div');
            div.className = 'q-block';
            div.style.cssText = "background:#fff; padding:12px; border-radius:8px; margin-bottom:10px; border:1px solid var(--border);";
            div.innerHTML = `
                <div class="form-group"><label>Câu hỏi ${qCount}:</label><input type="text" class="q-txt" placeholder="Nội dung câu hỏi"></div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                    <input type="text" class="opt-0" placeholder="Đáp án A">
                    <input type="text" class="opt-1" placeholder="Đáp án B">
                    <input type="text" class="opt-2" placeholder="Đáp án C">
                    <input type="text" class="opt-3" placeholder="Đáp án D">
                </div>
                <div class="form-group" style="margin-top:8px;">
                    <label>Đáp án đúng:</label>
                    <select class="q-correct"><option value="0">Đáp án A</option><option value="1">Đáp án B</option><option value="2">Đáp án C</option><option value="3">Đáp án D</option></select>
                </div>
            `;
            c.appendChild(div);
        }

        function saveNewExam() {
            let title = document.getElementById('new-exam-title').value.trim();
            let time = parseInt(document.getElementById('new-exam-time').value) || 15;
            if(!title) { alert("Nhập tên đề thi!"); return; }

            let blocks = document.querySelectorAll('.q-block');
            let questions = [];
            blocks.forEach(b => {
                let q = b.querySelector('.q-txt').value.trim();
                let o0 = b.querySelector('.opt-0').value.trim();
                let o1 = b.querySelector('.opt-1').value.trim();
                let o2 = b.querySelector('.opt-2').value.trim();
                let o3 = b.querySelector('.opt-3').value.trim();
                let correct = parseInt(b.querySelector('.q-correct').value);
                if(q && o0 && o1) {
                    questions.push({ question: q, options: [o0, o1, o2||"C", o3||"D"], correct: correct });
                }
            });

            if(questions.length === 0) { alert("Thêm ít nhất 1 câu hỏi hoàn chỉnh!"); return; }

            exams.push({ id: Date.now(), title, time, questions });
            localStorage.setItem('app_exams', JSON.stringify(exams));
            alert("Đã lưu đề thi thành công!");
            location.reload();
        }

        // Học sinh làm bài
        function startQuiz(idx) {
            currentExam = exams[idx];
            userAnswers = {};
            document.getElementById('main-app').style.display = 'none';
            document.getElementById('quiz-container').style.display = 'block';
            document.getElementById('quiz-exam-title').textContent = currentExam.title;

            let html = '';
            currentExam.questions.forEach((q, i) => {
                html += `<div style="margin-bottom:20px;">
                    <div style="font-weight:600; margin-bottom:8px;">Câu ${i+1}:${q.
